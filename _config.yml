title: "Documentos legales de mis apps"
description: "Avisos de privacidad, términos y otros documentos legales de mis aplicaciones."
url: "" # ej: https://tu-usuario.github.io  (recomendado: permite URLs absolutas/canónicas)
baseurl: "/legal-docs" # cámbialo si renombras el repo, o déjalo "" si usas un dominio propio o un repo tipo usuario.github.io

# Solo se usa lo que GitHub Pages construye de forma nativa (sin GitHub Actions
# ni build local). GitHub Pages también admite plugins de su lista blanca,
# como jekyll-sitemap o jekyll-seo-tag, si más adelante se necesitan.
markdown: kramdown
kramdown:
  input: GFM

# Cada archivo en _docs/<app>/<tipo>.md se publica en /apps/<app>/<tipo>/
collections:
  docs:
    output: true
    permalink: /apps/:path/

defaults:
  - scope:
      path: ""
      type: "docs"
    values:
      layout: "doc"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - scripts
  - _templates
